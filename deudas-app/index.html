<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Deudas</title>
    <!-- Tailwind CSS para diseño móvil moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
</head>
<body class="bg-gray-100 text-gray-800 font-sans pb-20">

    <!-- Header -->
    <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-50">
        <h1 class="text-xl font-bold text-center">Control de Deudas y Abonos</h1>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-6">

        <!-- Tarjeta de Resumen Global -->
        <div class="bg-white p-4 rounded-xl shadow-md border-l-4 border-blue-600 flex justify-between items-center">
            <div>
                <p class="text-sm text-gray-500 font-medium">Deuda Total Pendiente</p>
                <h2 id="totalGeneral" class="text-2xl font-bold text-gray-900">$0.00</h2>
            </div>
            <button onclick="abrirModalProveedor()" class="bg-blue-600 text-white px-3 py-2 rounded-lg text-sm font-semibold shadow hover:bg-blue-700">
                + Proveedor
            </button>
        </div>

        <!-- Sección de Proveedores y Deudas -->
        <section>
            <h3 class="text-lg font-semibold mb-3 text-gray-700">Proveedores</h3>
            <div id="listaProveedores" class="space-y-3">
                <!-- Se cargan dinámicamente con JS -->
            </div>
        </section>

        <!-- Historial de Abonos Recientes -->
        <section class="mt-6">
            <h3 class="text-lg font-semibold mb-3 text-gray-700">Historial de Abonos</h3>
            <div id="listaHistorial" class="space-y-2">
                <!-- Se cargan dinámicamente con JS -->
            </div>
        </section>

    </main>

    <!-- Modal para Agregar Proveedor -->
    <div id="modalProveedor" class="fixed inset-0 bg-black/50 hidden justify-center items-center p-4 z-50">
        <div class="bg-white w-full max-w-sm p-5 rounded-2xl shadow-xl space-y-4">
            <h3 class="text-lg font-bold">Nuevo Proveedor</h3>
            <input type="text" id="nombreProveedor" placeholder="Nombre del Proveedor" class="w-full border p-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600">
            <input type="number" id="deudaInicial" placeholder="Deuda Inicial ($)" class="w-full border p-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600">
            <div class="flex justify-end space-x-2">
                <button onclick="cerrarModalProveedor()" class="px-4 py-2 text-gray-500 font-medium">Cancelar</button>
                <button onclick="guardarProveedor()" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-medium">Guardar</button>
            </div>
        </div>
    </div>

    <!-- Modal para Registrar Abono -->
    <div id="modalAbono" class="fixed inset-0 bg-black/50 hidden justify-center items-center p-4 z-50">
        <div class="bg-white w-full max-w-sm p-5 rounded-2xl shadow-xl space-y-4">
            <h3 class="text-lg font-bold" id="tituloModalAbono">Registrar Abono</h3>
            <input type="hidden" id="indexProveedorActual">
            <input type="number" id="montoAbono" placeholder="Monto del Abono ($)" class="w-full border p-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600">
            <input type="text" id="detalleAbono" placeholder="¿Qué se le dio? (Ej: Efectivo, Mercadería...)" class="w-full border p-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600">
            <div class="flex justify-end space-x-2">
                <button onclick="cerrarModalAbono()" class="px-4 py-2 text-gray-500 font-medium">Cancelar</button>
                <button onclick="guardarAbono()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg font-medium">Registrar</button>
            </div>
        </div>
    </div>

    <!-- Lógica de la App -->
    <script>
        // Registrar Service Worker para PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        // Estado inicial de datos (lee de localStorage o inicia vacío)
        let datos = JSON.parse(localStorage.getItem('deudasPapa')) || { proveedores: [], historial: [] };

        function guardarDatos() {
            localStorage.setItem('deudasPapa', JSON.stringify(datos));
            renderizar();
        }

        function renderizar() {
            let listaP = document.getElementById('listaProveedores');
            let listaH = document.getElementById('listaHistorial');
            let totalGeneralEl = document.getElementById('totalGeneral');
            
            listaP.innerHTML = '';
            listaH.innerHTML = '';
            let totalGeneral = 0;

            // Renderizar Proveedores
            if (datos.proveedores.length === 0) {
                listaP.innerHTML = `<p class="text-sm text-gray-400 text-center py-4">No hay proveedores registrados aún.</p>`;
            } else {
                datos.proveedores.forEach((p, index) => {
                    totalGeneral += p.deuda;
                    listaP.innerHTML += `
                        <div class="bg-white p-4 rounded-xl shadow-sm border flex justify-between items-center">
                            <div>
                                <h4 class="font-bold text-gray-800">${p.nombre}</h4>
                                <p class="text-sm text-red-600 font-semibold">Deuda: $${p.deuda.toFixed(2)}</p>
                            </div>
                            <div class="space-x-1">
                                <button onclick="abrirModalAbono(${index})" class="bg-emerald-500 text-white px-3 py-1.5 rounded-lg text-xs font-semibold shadow">Abonar</button>
                                <button onclick="eliminarProveedor(${index})" class="text-gray-400 hover:text-red-600 p-1">🗑️</button>
                            </div>
                        </div>
                    `;
                });
            }

            totalGeneralEl.innerText = `$${totalGeneral.toFixed(2)}`;

            // Renderizar Historial
            if (datos.historial.length === 0) {
                listaH.innerHTML = `<p class="text-sm text-gray-400 text-center py-2">Sin abonos recientes.</p>`;
            } else {
                datos.historial.slice(-5).reverse().forEach(h => {
                    listaH.innerHTML += `
                        <div class="bg-white p-3 rounded-lg shadow-sm border text-sm flex justify-between items-center">
                            <div>
                                <span class="font-bold text-gray-700">${h.proveedor}</span>
                                <p class="text-xs text-gray-500">${h.detalle} - <span class="italic">${h.fecha}</span></p>
                            </div>
                            <span class="font-bold text-emerald-600">-$${h.monto.toFixed(2)}</span>
                        </div>
                    `;
                });
            }
        }

        // Modales
        function abrirModalProveedor() { document.getElementById('modalProveedor').classList.remove('hidden'); document.getElementById('modalProveedor').classList.add('flex'); }
        function cerrarModalProveedor() { document.getElementById('modalProveedor').classList.add('hidden'); document.getElementById('modalProveedor').classList.remove('flex'); }

        function guardarProveedor() {
            let nombre = document.getElementById('nombreProveedor').value;
            let deuda = parseFloat(document.getElementById('deudaInicial').value);
            if (!nombre || isNaN(deuda)) return alert('Por favor llena todos los campos correctamente.');

            datos.proveedores.push({ nombre, deuda });
            document.getElementById('nombreProveedor').value = '';
            document.getElementById('deudaInicial').value = '';
            cerrarModalProveedor();
            guardarDatos();
        }

        function eliminarProveedor(index) {
            if (confirm('¿Seguro que deseas eliminar este proveedor y su historial?')) {
                datos.proveedores.splice(index, 1);
                guardarDatos();
            }
        }

        function abrirModalAbono(index) {
            document.getElementById('indexProveedorActual').value = index;
            document.getElementById('tituloModalAbono').innerText = `Abonar a: ${datos.proveedores[index].nombre}`;
            document.getElementById('modalAbono').classList.remove('hidden');
            document.getElementById('modalAbono').classList.add('flex');
        }

        function cerrarModalAbono() { document.getElementById('modalAbono').classList.add('hidden'); document.getElementById('modalAbono').classList.remove('flex'); }

        function guardarAbono() {
            let index = document.getElementById('indexProveedorActual').value;
            let monto = parseFloat(document.getElementById('montoAbono').value);
            let detalle = document.getElementById('detalleAbono').value || 'Abono general';

            if (isNaN(monto) || monto <= 0) return alert('Ingresa un monto válido.');
            if (monto > datos.proveedores[index].deuda) return alert('El abono no puede ser mayor a la deuda actual.');

            datos.proveedores[index].deuda -= monto;
            
            let fecha = new Date().toLocaleDateString();
            datos.historial.push({ proveedor: datos.proveedores[index].nombre, monto, detalle, fecha });

            document.getElementById('montoAbono').value = '';
            document.getElementById('detalleAbono').value = '';
            cerrarModalAbono();
            guardarDatos();
        }

        // Cargar datos al iniciar
        renderizar();
    </script>
</body>
</html>
